services:
  frontend:
    container_name: frontend
    build: ./frontend/
    command: npm start
    develop:
      watch:
        - action: sync
          path: ./frontend/
          target: /app
    volumes:
      - ./frontend/src:/app/src
    ports:
      - 3000:3000
    networks:
      - test_network

  backend:
    container_name: backend
    build: ./backend/
    command: npx ts-node src/index.ts
    develop:
      watch:
        - action: sync
          path: ./backend/src
          target: /app/src
    volumes:
      - ./backend/src:/app/src
      - ./backend/.env:/app/.env
    ports:
      - 4000:4000
    networks:
      - test_network
    extra_hosts:
      - "host.docker.internal:host-gateway"

networks:
  test_network:
    name: test_network
    driver: bridge
